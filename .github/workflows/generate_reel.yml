name: OpenCode HyperFrames Pipeline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'SaaS / Website Target URL'
        required: true
        default: 'https://aicarousels.com'
      stage:
        description: 'Execution Stage (capture or render)'
        required: true
        default: 'capture'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js & FFmpeg
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python & Node Dependencies
        run: |
          pip install playwright camoufox edge-tts requests Pillow
          playwright install firefox
          npm install -g hyperframes

      - name: Execute Stage 1 (Capture Raw Footage)
        if: ${{ github.event.inputs.stage == 'capture' }}
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stage1_capture.py

      - name: Execute Stage 2 (HyperFrames HTML-to-Video Render)
        if: ${{ github.event.inputs.stage == 'render' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stage2_render.py
