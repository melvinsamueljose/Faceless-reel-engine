name: OpenCode HyperFrames Pipeline

on:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js & FFmpeg
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python & Node Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts
          npm install -g hyperframes || true

      - name: Stage 1 - Capture Telegram Media & Parse Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stage1_capture.py

      - name: Stage 2 - Render HyperFrames & Dispatch Video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python stage2_render.py
