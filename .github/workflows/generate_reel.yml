name: Generate and Render Faceless Reel

on:
  workflow_dispatch:
    inputs:
      tool_url:
        description: 'Target Website/SaaS URL'
        required: true
        default: 'https://aicarousels.com'
      caption_text:
        description: 'Overlay Caption Text'
        required: false
        default: 'Check out this insane AI tool!'

jobs:
  generate-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu

      - name: Install Python Packages & Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Execute Reel Engine
        env:
          TOOL_URL: ${{ github.event.inputs.tool_url }}
          OVERLAY_TEXT: ${{ github.event.inputs.caption_text }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine.py

      - name: Send Video to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py
