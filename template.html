<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0f12;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }
    
    .composition {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    .desktop-clip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 1920px;
      width: 3413px;
      object-fit: cover;
      filter: brightness(0.95) contrast(1.05);
    }

    .hook-card {
      position: absolute;
      bottom: 300px;
      left: 540px;
      transform: translateX(-50%);
      width: 900px;
      background: rgba(15, 23, 42, 0.90);
      border: 4px solid #00ffaa;
      border-radius: 24px;
      padding: 30px 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      box-sizing: border-box;
    }

    .hook-text {
      color: #ffffff;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.2;
      margin: 0;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="composition" data-composition-id="main-reel" data-width="1080" data-height="1920" data-fps="30">
    
    <video 
      class="clip desktop-clip" 
      src="raw_desktop.webm" 
      data-start="0" 
      data-duration="{{DURATION}}" 
      data-track-index="1">
    </video>

    <div 
      class="clip hook-card" 
      data-start="0" 
      data-duration="{{DURATION}}" 
      data-track-index="2">
      <h1 class="hook-text">{{HOOK_TEXT}}</h1>
    </div>

    <audio 
      class="clip" 
      src="voiceover.mp3" 
      data-start="0" 
      data-duration="{{DURATION}}" 
      data-track-index="3">
    </audio>

  </div>
</body>
</html>
